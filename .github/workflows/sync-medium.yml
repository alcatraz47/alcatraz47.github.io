name: Sync Medium posts

on:
  push:
    branches: ["gh-pages"]
    paths:
      - "scripts/sync_medium.py"
      - ".github/workflows/sync-medium.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-medium:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Medium feed into _posts
        run: python scripts/sync_medium.py

      - name: Commit and push changes
        run: |
          if git diff --quiet -- _posts; then
            echo "No Medium post updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts
          git commit -m "chore: sync Medium posts"
          git push
